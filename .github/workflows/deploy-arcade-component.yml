name: Deploy arcade component (reusable)

on:
  workflow_call:
    inputs:
      support-sha:
        description: Full SHA matching this reusable workflow pin
        required: true
        type: string
      game-id:
        required: true
        type: string
      prebuild-command:
        description: Existing unit/lint/worker gates, excluding the build
        required: true
        type: string
      postbuild-command:
        description: Component and standalone browser gates against the completed build
        required: true
        type: string
      bundle-check-command:
        type: string
        default: ''
      pages-base:
        description: Nonempty only for the existing GitHub Pages publications
        type: string
        default: ''
      lighthouse-pwa-gate:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: arcade-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cloudflare:
    # Production snapshots always target the current default-branch commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: quiet-build/.github
          ref: ${{ inputs.support-sha }}
          path: .arcade-support
          persist-credentials: false
      - name: Check pinned helper and move it outside the game source
        env:
          SUPPORT_SHA: ${{ inputs.support-sha }}
        run: |
          test "$(git -C .arcade-support rev-parse HEAD)" = "$SUPPORT_SHA"
          python3 .arcade-support/scripts/retain_arcade_assets.py check-pin .github/workflows/deploy.yml "$SUPPORT_SHA"
          mv .arcade-support "$RUNNER_TEMP/arcade-support"
          ruby "$RUNNER_TEMP/arcade-support/scripts/check_arcade_callers.rb" "$RUNNER_TEMP/arcade-support/.github/workflows/deploy-arcade-component.yml" "$SUPPORT_SHA" .github/workflows/deploy.yml
          node --test "$RUNNER_TEMP/arcade-support/scripts/release-arcade.test.mjs"
          python3 "$RUNNER_TEMP/arcade-support/scripts/test_write_build_identity.py"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Required source gates
        run: ${{ inputs.prebuild-command }}
      - name: Build relocatable complete game artifact
        run: pnpm build
        env:
          VITE_BASE: ./
      - name: Write build identity
        env:
          BUILD_ID: ${{ inputs.game-id }}
        run: node "$RUNNER_TEMP/arcade-support/scripts/write_build_identity.js" dist
      - name: Required component and standalone gates
        run: ${{ inputs.postbuild-command }}
        env:
          CI: 'true'
          VITE_BASE: ./
      - name: Existing bundle budget
        if: inputs.bundle-check-command != ''
        run: ${{ inputs.bundle-check-command }}
      - name: Existing PWA budget against this root build
        if: inputs.lighthouse-pwa-gate != ''
        env:
          PWA_GATE: ${{ inputs.lighthouse-pwa-gate }}
          VITE_BASE: ./
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5199 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm dlx lighthouse@11.7.1 http://127.0.0.1:5199/ --only-categories=pwa --output=json --output-path="$RUNNER_TEMP/lighthouse.json" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node -e 'const r=require(process.env.RUNNER_TEMP+"/lighthouse.json"); const s=r.categories.pwa.score; console.log("PWA score:",s,"gate:",process.env.PWA_GATE); if(typeof s!=="number" || s<Number(process.env.PWA_GATE)) process.exit(1)'
      - name: Install checksum-pinned rclone
        run: node "$RUNNER_TEMP/arcade-support/scripts/install-rclone.mjs"
      - name: Publish this game only after complete CDN verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCADE_GAMES: '["${{ inputs.game-id }}"]'
        run: node "$RUNNER_TEMP/arcade-support/scripts/release-arcade.mjs" publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-release
          path: .release/r2/*-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  github-pages:
    if: inputs.pages-base != ''
    needs: cloudflare
    runs-on: ubuntu-latest
    # Inherit the caller: only opted-in Pages callers grant Pages/OIDC scopes.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build separate GitHub Pages artifact
        env:
          VITE_BASE: ${{ inputs.pages-base }}
        run: pnpm build
      - uses: actions/checkout@v6
        with:
          repository: quiet-build/.github
          ref: ${{ inputs.support-sha }}
          path: .arcade-support
          persist-credentials: false
      - name: Write build identity
        env:
          BUILD_ID: ${{ inputs.game-id }}
        run: node .arcade-support/scripts/write_build_identity.js dist
      - name: Existing bundle budget
        if: inputs.bundle-check-command != ''
        run: ${{ inputs.bundle-check-command }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Preserve existing published GitHub Pages PWA audit
        if: inputs.lighthouse-pwa-gate != ''
        env:
          PWA_GATE: ${{ inputs.lighthouse-pwa-gate }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          pnpm dlx lighthouse@11.7.1 "$PAGE_URL" --only-categories=pwa --output=json --output-path="$RUNNER_TEMP/lighthouse.json" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node -e 'const r=require(process.env.RUNNER_TEMP+"/lighthouse.json"); const s=r.categories.pwa.score; console.log("Published GH Pages PWA score:",s,"gate:",process.env.PWA_GATE); if(typeof s!=="number" || s<Number(process.env.PWA_GATE)) process.exit(1)'
