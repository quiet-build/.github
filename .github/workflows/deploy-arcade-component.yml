name: Deploy arcade component (reusable)

on:
  workflow_call:
    inputs:
      support-sha:
        description: Full SHA matching this reusable workflow pin
        required: true
        type: string
      cloudflare-project-name:
        required: true
        type: string
      cloudflare-domain:
        description: Optional existing custom domain to verify before upload
        type: string
        default: ''
      prebuild-command:
        description: Existing unit/lint/worker gates, excluding the build
        required: true
        type: string
      postbuild-command:
        description: Component and standalone browser gates against the completed build
        required: true
        type: string
      bundle-check-command:
        type: string
        default: ''
      pages-base:
        description: Nonempty only for the existing GitHub Pages publications
        type: string
        default: ''
      lighthouse-pwa-gate:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: arcade-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cloudflare:
    # Production snapshots always target the current default-branch commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: quiet-build/.github
          ref: ${{ inputs.support-sha }}
          path: .arcade-support
          persist-credentials: false
      - name: Check pinned helper and move it outside the game source
        env:
          SUPPORT_SHA: ${{ inputs.support-sha }}
        run: |
          test "$(git -C .arcade-support rev-parse HEAD)" = "$SUPPORT_SHA"
          python3 .arcade-support/scripts/retain_arcade_assets.py check-pin .github/workflows/deploy.yml "$SUPPORT_SHA"
          mv .arcade-support "$RUNNER_TEMP/arcade-support"
          python3 "$RUNNER_TEMP/arcade-support/scripts/test_retain_arcade_assets.py"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Required source gates
        run: ${{ inputs.prebuild-command }}
      - name: Build Cloudflare root artifact
        run: pnpm build
        env:
          VITE_BASE: /
      - name: Required component and standalone gates
        run: ${{ inputs.postbuild-command }}
        env:
          CI: 'true'
          VITE_BASE: /
      - name: Existing bundle budget
        if: inputs.bundle-check-command != ''
        run: ${{ inputs.bundle-check-command }}
      - name: Existing PWA budget against this root build
        if: inputs.lighthouse-pwa-gate != ''
        env:
          PWA_GATE: ${{ inputs.lighthouse-pwa-gate }}
          VITE_BASE: /
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5199 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm dlx lighthouse@11.7.1 http://127.0.0.1:5199/ --only-categories=pwa --output=json --output-path="$RUNNER_TEMP/lighthouse.json" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node -e 'const r=require(process.env.RUNNER_TEMP+"/lighthouse.json"); const s=r.categories.pwa.score; console.log("PWA score:",s,"gate:",process.env.PWA_GATE); if(typeof s!=="number" || s<Number(process.env.PWA_GATE)) process.exit(1)'
      - name: Verify existing Cloudflare project and requested domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ inputs.cloudflare-project-name }}
          CF_DOMAIN: ${{ inputs.cloudflare-domain }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT" > "$RUNNER_TEMP/project.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/project.json"); if(!r.success || r.result.name!==process.env.CF_PROJECT || (process.env.CF_DOMAIN && !r.result.domains.includes(process.env.CF_DOMAIN))) throw Error("Existing Pages project/domain verification failed")'
      - name: Restore and publish a new recoverable asset snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          helper="$RUNNER_TEMP/arcade-support/scripts/retain_arcade_assets.py"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous_tag=$(python3 "$helper" select-release "$RUNNER_TEMP/releases.json")
          previous=-
          if [ -n "$previous_tag" ]; then
            mkdir "$RUNNER_TEMP/previous"
            gh release download "$previous_tag" --repo "$GH_REPO" --pattern snapshot.zip --dir "$RUNNER_TEMP/previous"
            previous="$RUNNER_TEMP/previous/snapshot.zip"
          fi
          python3 "$helper" merge dist "$previous" "$RUNNER_TEMP/snapshot.zip"
          tag="arcade-assets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$RUNNER_TEMP/snapshot.zip" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --latest=false --title "$tag" --notes "Cumulative immutable arcade dependencies for $GITHUB_SHA; saved before production upload."
      - name: Deploy retained root artifact to existing Cloudflare project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=${{ inputs.cloudflare-project-name }} --branch=main

  github-pages:
    if: inputs.pages-base != ''
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build separate GitHub Pages artifact
        env:
          VITE_BASE: ${{ inputs.pages-base }}
        run: pnpm build
      - name: Existing bundle budget
        if: inputs.bundle-check-command != ''
        run: ${{ inputs.bundle-check-command }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Preserve existing published GitHub Pages PWA audit
        if: inputs.lighthouse-pwa-gate != ''
        env:
          PWA_GATE: ${{ inputs.lighthouse-pwa-gate }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          pnpm dlx lighthouse@11.7.1 "$PAGE_URL" --only-categories=pwa --output=json --output-path="$RUNNER_TEMP/lighthouse.json" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          node -e 'const r=require(process.env.RUNNER_TEMP+"/lighthouse.json"); const s=r.categories.pwa.score; console.log("Published GH Pages PWA score:",s,"gate:",process.env.PWA_GATE); if(typeof s!=="number" || s<Number(process.env.PWA_GATE)) process.exit(1)'
