name: Deploy static site reusable
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      install-command:
        required: false
        type: string
        default: 'npm ci --legacy-peer-deps'
      build-command:
        required: false
        type: string
        default: 'npm run build'
      dist-dir:
        required: false
        type: string
        default: 'dist'
      pages-base:
        required: false
        type: string
        default: ''
      cloudflare-project-name:
        required: false
        type: string
        default: ''
      cloudflare-branch:
        required: false
        type: string
        default: 'main'
      bundle-check-command:
        required: false
        type: string
        default: ''
      lighthouse-pwa-gate:
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "bundle: ${{ inputs.bundle-check-command }}"
          echo "gate: ${{ inputs.lighthouse-pwa-gate }}"
          echo "token-len: ${#TOK}"
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
